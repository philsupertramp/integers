name: MNIST 16-layer fixed-seed subunit-carry causal A/B (20 epochs)

on:
  pull_request:
    branches: [research/depth-numerical-diagnostics]
    paths:
      - '.github/workflows/mnist-subunit-carry-20epoch.yml'

permissions:
  contents: read

concurrency:
  group: subunit-carry-ablation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  correctness-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fail closed on Rust/Python regressions and numerical fixtures
        run: |
          test "$(uname -m)" = x86_64
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          python3 -m unittest discover -s tests -p test_depth_paired_abba.py -v
      - name: Download MNIST training files only
        run: |
          python3 experiments/fetch_mnist.py --data-dir data/mnist --train-only
          test ! -e data/mnist/t10k-images-idx3-ubyte
          test ! -e data/mnist/t10k-labels-idx1-ubyte
      - name: Build reference and treatment from same locked source
        run: cargo build --locked --release --example held_out
      - name: Check 16/20-layer baseline, reference, and carry trace invariance
        run: python3 tests/check_depth_trace.py

  frozen-arms:
    name: depth-16 seed-4242 ${{ matrix.arm }}
    needs: correctness-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arm: [baseline, subunit_carry24]
    env:
      ARM: ${{ matrix.arm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Obtain exactly the MNIST development cohort
        run: |
          test "$(uname -m)" = x86_64
          python3 experiments/fetch_mnist.py --data-dir data/mnist --train-only
          test ! -e data/mnist/t10k-images-idx3-ubyte
          test ! -e data/mnist/t10k-labels-idx1-ubyte
      - name: Build frozen deterministic paired models
        run: cargo build --release --locked --example held_out
      - name: Train predeclared 20-epoch paired control/treatment
        run: |
          OUT="/tmp/mnist-d16-s4242-${ARM}"
          python3 experiments/depth_paired_abba.py plan \
            --dir "$OUT" --single-pass --trace-layers \
            --optimizer-mode "$ARM" \
            --seeds 4242 --depths 16 --epochs 20 \
            --train-limit 8192 --validation-limit 1042 \
            --batch-size 32 --lr-shift 7
          python3 experiments/depth_paired_abba.py run --dir "$OUT"
          python3 experiments/depth_paired_abba.py analyze --dir "$OUT"
          test ! -e data/mnist/t10k-images-idx3-ubyte
          test ! -e data/mnist/t10k-labels-idx1-ubyte
      - name: Publish complete independent learning verdict
        if: success()
        run: cat "/tmp/mnist-d16-s4242-${ARM}/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve plan, raw learning curves, activation/gradient/update traces and checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnist-d16-s4242-${{ matrix.arm }}-20epoch
          path: /tmp/mnist-d16-s4242-${{ matrix.arm }}/
          if-no-files-found: warn
          retention-days: 30
