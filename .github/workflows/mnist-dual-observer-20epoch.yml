name: MNIST dual numerical observability — 20 epoch paired x86_64

on:
  pull_request:
    branches: [research/depth-4-8-paired-abba]
    paths:
      - '.github/workflows/mnist-dual-observer-20epoch.yml'

permissions:
  contents: read

concurrency:
  group: mnist-dual-observer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify native x86 and both non-mutating numeric observers
        run: |
          test "$(uname -m)" = x86_64
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          python3 -m unittest discover -s tests -p 'test_depth_paired_abba.py' -v
      - name: MNIST training IDX only
        run: |
          python3 experiments/fetch_mnist.py --data-dir data/mnist --train-only
          test ! -e data/mnist/t10k-images-idx3-ubyte
          test ! -e data/mnist/t10k-labels-idx1-ubyte
      - name: Compile frozen independent integer / FP32 paired control
        run: cargo build --locked --release --example held_out
      - name: Confirm on/off observer has no numerical effect on learning
        run: python3 tests/check_depth_trace.py

  paired-20-epoch:
    name: depth-${{ matrix.depth }} / seed-4242 / dual trace
    needs: diagnostic-control
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        depth: [16, 20]
    env:
      DEPTH: ${{ matrix.depth }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch checked MNIST development IDX only
        run: |
          test "$(uname -m)" = x86_64
          python3 experiments/fetch_mnist.py --data-dir data/mnist --train-only
          test ! -e data/mnist/t10k-images-idx3-ubyte
          test ! -e data/mnist/t10k-labels-idx1-ubyte
      - name: Build deterministic paired models
        run: cargo build --locked --release --example held_out
      - name: Run both observers together over 20 epochs
        run: |
          OUT="/tmp/mnist-dual-observer-d${DEPTH}-s4242"
          python3 experiments/depth_paired_abba.py plan \
            --dir "$OUT" --single-pass --trace-layers \
            --seeds 4242 --depths "$DEPTH" --epochs 20 \
            --train-limit 8192 --validation-limit 1042 \
            --batch-size 32 --lr-shift 7
          python3 experiments/depth_paired_abba.py run --dir "$OUT"
          python3 experiments/depth_paired_abba.py analyze --dir "$OUT"
          test ! -e data/mnist/t10k-images-idx3-ubyte
          test ! -e data/mnist/t10k-labels-idx1-ubyte
      - name: Publish paired learning verdict
        if: success()
        run: cat "/tmp/mnist-dual-observer-d${DEPTH}-s4242/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve trace records, locked plan, raw epochs and verified logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnist-dual-observer-d${{ matrix.depth }}-s4242
          path: /tmp/mnist-dual-observer-d${{ matrix.depth }}-s4242/
          retention-days: 30
          if-no-files-found: warn
