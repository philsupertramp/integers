name: MNIST 16conv backward guard3 isolated A/B

on:
  pull_request:
    branches: [research/pool-routing-backward-rounding]
    paths:
      - 'src/nn/**'
      - 'examples/held_out.rs'
      - 'experiments/depth_paired_abba.py'
      - 'tests/check_depth_trace.py'
      - 'tests/test_depth_paired_abba.py'
      - 'tests/check_backward_guard3.py'
      - '.github/workflows/backward-guard3-ablation.yml'

permissions:
  contents: read

concurrency:
  group: backward-guard3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Formatting, Rust regression and frozen protocol checks
        run: |
          test "$(uname -m)" = x86_64
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          python3 -m unittest discover -s tests -p test_depth_paired_abba.py -v
      - name: Download only MNIST development-training IDX
        run: |
          python3 experiments/fetch_mnist.py --data-dir data/mnist --train-only
          test ! -e data/mnist/t10k-images-idx3-ubyte
          test ! -e data/mnist/t10k-labels-idx1-ubyte
      - name: Build identical paired model source
        run: cargo build --release --locked --example held_out
      - name: Guarded and unguarded trace-on/off reproducibility
        run: python3 tests/check_depth_trace.py
      - name: Prove unchanged first-minibatch forward gates and MaxPool winners
        run: python3 tests/check_backward_guard3.py

  frozen-arms:
    name: 16conv seed4242 / ${{ matrix.arm }} / 20 epochs
    needs: correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arm: [baseline, guard3]
    env:
      ARM: ${{ matrix.arm }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Load only matched MNIST training corpus
        run: |
          python3 experiments/fetch_mnist.py --data-dir data/mnist --train-only
          test ! -e data/mnist/t10k-images-idx3-ubyte
          test ! -e data/mnist/t10k-labels-idx1-ubyte
      - name: Compile independent integer and FP32 source
        run: cargo build --release --locked --example held_out
      - name: Run immutable paired development-validation study
        run: |
          OUT="/tmp/mnist-backward-d16-s4242-${ARM}"
          python3 experiments/depth_paired_abba.py plan \
            --dir "$OUT" --single-pass --trace-layers \
            --backward-precision "$ARM" \
            --seeds 4242 --depths 16 --epochs 20 \
            --train-limit 8192 --validation-limit 1042 \
            --batch-size 32 --lr-shift 7
          python3 experiments/depth_paired_abba.py run --dir "$OUT"
          python3 experiments/depth_paired_abba.py analyze --dir "$OUT"
          test ! -e data/mnist/t10k-images-idx3-ubyte
          test ! -e data/mnist/t10k-labels-idx1-ubyte
      - name: Show paired integer/FP32 learning verdict
        if: success()
        run: cat "/tmp/mnist-backward-d16-s4242-${ARM}/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Archive frozen plan, layer traces, epoch curves and verified logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnist-backward-guard3-d16-s4242-${{ matrix.arm }}
          path: /tmp/mnist-backward-d16-s4242-${{ matrix.arm }}/
          if-no-files-found: warn
          retention-days: 30
