name: Sub-unit optimizer carry ablation — correctness smoke

on:
  pull_request:
    branches: [research/depth-numerical-diagnostics]
    paths:
      - 'src/nn/subunit_carry.rs'
      - 'src/nn/mod.rs'
      - 'src/nn/conv.rs'
      - 'src/nn/linear.rs'
      - 'examples/held_out.rs'
      - 'experiments/depth_paired_abba.py'
      - 'tests/check_depth_trace.py'
      - 'tests/test_depth_paired_abba.py'
      - '.github/workflows/subunit-carry-smoke.yml'

permissions:
  contents: read

jobs:
  correctness-and-observer:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting, numerical fixtures and immutable experiment protocol
        run: |
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          python3 -m unittest discover -s tests -p test_depth_paired_abba.py -v
      - name: Obtain only canonical MNIST development data
        run: |
          python3 experiments/fetch_mnist.py --data-dir data/mnist --train-only
          test ! -e data/mnist/t10k-images-idx3-ubyte
          test ! -e data/mnist/t10k-labels-idx1-ubyte
      - name: Build dual backend with opt-in carry
        run: cargo build --locked --release --example held_out
      - name: Verify trace on vs off for baseline, FP32, and carry optimizer
        run: python3 tests/check_depth_trace.py
