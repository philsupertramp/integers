name: 16-layer MNIST 2x2 backward guard3 and carry24 ablation

on:
  pull_request:
    branches: [research/backward-gradient-guard-bits]
    paths:
      - 'src/nn/**'
      - 'examples/held_out.rs'
      - 'experiments/depth_paired_abba.py'
      - 'tests/check_depth_trace.py'
      - 'tests/test_depth_paired_abba.py'
      - 'tests/check_guard3_carry_factorial.py'
      - '.github/workflows/guard3-carry-factorial.yml'

permissions:
  contents: read

concurrency:
  group: guard3-carry-factorial-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Formatting, integer arithmetic tests, and locked protocol
        run: |
          test "$(uname -m)" = x86_64
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          python3 -m unittest discover -s tests -p test_depth_paired_abba.py -v
      - name: MNIST development training IDX only
        run: |
          python3 experiments/fetch_mnist.py --data-dir data/mnist --train-only
          test ! -e data/mnist/t10k-images-idx3-ubyte
          test ! -e data/mnist/t10k-labels-idx1-ubyte
      - name: Compile independent integer/FP32 models
        run: cargo build --release --locked --example held_out
      - name: Trace-on/off outcomes unchanged in baseline, carry, guard and combined
        run: python3 tests/check_depth_trace.py
      - name: Prove all four variants start with identical forward activations
        run: python3 tests/check_guard3_carry_factorial.py

  factorial:
    name: 16conv seed4242 20epoch / ${{ matrix.label }}
    needs: correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: baseline
            backward: baseline
            optimizer: baseline
          - label: carry24
            backward: baseline
            optimizer: subunit_carry24
          - label: guard3
            backward: guard3
            optimizer: baseline
          - label: guard3_carry24
            backward: guard3
            optimizer: subunit_carry24
    env:
      LABEL: ${{ matrix.label }}
      BACKWARD: ${{ matrix.backward }}
      OPTIMIZER: ${{ matrix.optimizer }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch canonical MNIST development data only
        run: |
          test "$(uname -m)" = x86_64
          python3 experiments/fetch_mnist.py --data-dir data/mnist --train-only
          test ! -e data/mnist/t10k-images-idx3-ubyte
          test ! -e data/mnist/t10k-labels-idx1-ubyte
      - name: Compile exact same source into paired integer/FP32 binary
        run: cargo build --release --locked --example held_out
      - name: Train frozen 20epoch paired model with both diagnostics
        run: |
          OUT="/tmp/mnist-factorial-d16-s4242-${LABEL}"
          python3 experiments/depth_paired_abba.py plan \
            --dir "$OUT" --single-pass --trace-layers \
            --backward-precision "$BACKWARD" --optimizer-mode "$OPTIMIZER" \
            --seeds 4242 --depths 16 --epochs 20 \
            --train-limit 8192 --validation-limit 1042 \
            --batch-size 32 --lr-shift 7
          python3 experiments/depth_paired_abba.py run --dir "$OUT"
          python3 experiments/depth_paired_abba.py analyze --dir "$OUT"
          test ! -e data/mnist/t10k-images-idx3-ubyte
          test ! -e data/mnist/t10k-labels-idx1-ubyte
      - name: Publish independent learning verdict for each 2x2 arm
        if: success()
        run: cat "/tmp/mnist-factorial-d16-s4242-${LABEL}/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Archive SHA256-locked protocol, raw reports, curves and sampled diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnist-factorial-d16-s4242-${{ matrix.label }}
          path: /tmp/mnist-factorial-d16-s4242-${{ matrix.label }}/
          if-no-files-found: warn
          retention-days: 30
