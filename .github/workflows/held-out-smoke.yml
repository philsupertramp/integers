name: Held-out protocol smoke

on:
  pull_request:
    branches: [big-refactor]
  push:
    branches: [big-refactor]

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Deterministic split and sampling unit tests
        run: cargo test --locked --test experiment_protocol
      - name: Verify true mean-gradient scaling and momentum
        run: cargo test --locked --test batch_gradient_scaling
      - name: Prohibit access to historical Iris test file in CI
        run: rm data/iris_test.tsv
      - name: Paired integer / FP32 Iris validation-only fixture smoke
        run: python3 experiments/run_baselines.py --dataset iris --smoke --validation-only --epochs 2 --seeds 1337 2027 --output-dir /tmp/integers-smoke
      - name: Validate report structure and test isolation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/integers-smoke/iris/validation-only")
          reports = list(root.glob("*-seed-*.json"))
          assert len(reports) == 4
          assert (root / "manifest.json").exists()
          assert (root / "summary.md").exists()
          for path in reports:
              row = json.loads(path.read_text())
              assert row["smoke"] is True
              assert row["train_size"] == 12
              assert row["validation_size"] == 3
              assert row["validation_only"] is True
              assert row["test_evaluated"] is False and row["test_size"] == 0
              assert row["test_accuracy_pct"] is None and row["test_correct"] is None
              assert len(row["learning_curve"]) == 2
              assert 0 <= row["learning_curve"][-1]["validation_accuracy_pct"] <= 100
          PY
      - name: Iris validation-only selected protocol (3 seeds, 200 epochs)
        run: |
          python3 experiments/run_baselines.py --dataset iris --validation-only \
            --epochs 200 --batch-size 32 --lr-shift 6 --seeds 1337 2027 4242 \
            --output-dir /tmp/integers-iris-validation
      - name: Print Iris validation-only summary
        run: cat /tmp/integers-iris-validation/iris/validation-only/summary.md
      - name: Preserve lightweight Iris validation-only measurements
        uses: actions/upload-artifact@v4
        with:
          name: iris-validation-selected
          path: /tmp/integers-iris-validation/iris/validation-only/
          retention-days: 30

  mnist-sample:
    name: Bounded MNIST validation benchmark (integer + FP32)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download and SHA-256 verify canonical MNIST IDX
        run: python3 experiments/fetch_mnist.py --data-dir data/mnist
      - name: Run both backends on balanced MNIST CI cohort
        run: |
          python3 experiments/run_baselines.py --dataset mnist --ci-sample \
            --epochs 20 --seeds 1337 2027 --batch-size 32 \
            --lr-shift 7 --output-dir /tmp/integers-mnist-ci
      - name: Validate diagnostic report and forbid test metrics
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/integers-mnist-ci/mnist/ci-sample")
          reports = sorted(root.glob("*-seed-*.json"))
          assert len(reports) == 4
          assert (root / "summary.md").exists()
          manifest = json.loads((root / "manifest.json").read_text())
          assert len(manifest["sources_sha256"]) == 4
          assert "test NOT evaluated" in (root / "summary.md").read_text()
          for path in reports:
              row = json.loads(path.read_text())
              assert row["dataset"] == "mnist"
              assert row["ci_sample"] is True and row["smoke"] is False
              assert row["test_evaluated"] is False
              assert row["test_correct"] is None and row["test_accuracy_pct"] is None
              assert (row["train_size"], row["validation_size"], row["test_size"]) == (640, 200, 10000)
              assert row["epochs"] == 20 and row["seed"] in (1337, 2027)
              assert row["lr_shift"] == 7
              assert len(row["learning_curve"]) == 20
              assert all(m["training_samples"] == 640 for m in row["learning_curve"])
              assert all(0 <= m["validation_accuracy_pct"] <= 100 for m in row["learning_curve"])
          PY
      - name: Verify MNIST validation-only with NO test files present
        run: |
          # The original CI sample above uses all four canonical IDX inputs.
          # This independent directory contains ONLY the two train IDX files.
          mkdir -p /tmp/integers-mnist-train-only
          ln -s "$PWD/data/mnist/train-images-idx3-ubyte" /tmp/integers-mnist-train-only/
          ln -s "$PWD/data/mnist/train-labels-idx1-ubyte" /tmp/integers-mnist-train-only/
          test ! -e /tmp/integers-mnist-train-only/t10k-images-idx3-ubyte
          test ! -e /tmp/integers-mnist-train-only/t10k-labels-idx1-ubyte
          python3 experiments/run_baselines.py --dataset mnist             --validation-only --smoke --epochs 2 --seeds 1337 2027             --data-dir /tmp/integers-mnist-train-only             --output-dir /tmp/integers-mnist-validation-smoke
      - name: Assert MNIST test isolation, provenance and validation metrics
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/integers-mnist-validation-smoke/mnist/validation-only")
          manifest = json.loads((root / "manifest.json").read_text())
          sources = manifest["sources_sha256"]
          assert len(sources) == 2 and all("train-" in p for p in sources), sources
          assert not any("t10k" in p for p in sources)
          reports = list(root.glob("*-seed-*.json"))
          assert len(reports) == 4
          assert "test NOT loaded or evaluated" in (root / "summary.md").read_text()
          for path in reports:
              row = json.loads(path.read_text())
              assert row["dataset"] == "mnist"
              assert row["validation_only"] is True and row["ci_sample"] is False
              assert row["smoke"] is True
              assert row["test_evaluated"] is False
              assert row["test_correct"] is None and row["test_accuracy_pct"] is None
              assert (row["train_size"], row["validation_size"], row["test_size"]) == (40, 10, 0)
              assert row["epochs"] == 2
              assert len(row["learning_curve"]) == 2
              assert all(sum(epoch["validation_predictions"]) == 10
                         for epoch in row["learning_curve"])
          PY
      - name: Print MNIST validation-only comparison
        run: cat /tmp/integers-mnist-ci/mnist/ci-sample/summary.md
      - name: Preserve small MNIST diagnostics (no datasets or checkpoints)
        uses: actions/upload-artifact@v4
        with:
          name: mnist-ci-sample
          path: /tmp/integers-mnist-ci/mnist/ci-sample/
          retention-days: 14

