name: MNIST deep CNN 12/16/20 construction and paired gradient smoke

on:
  pull_request:
    branches: [big-refactor]
    paths:
      - 'examples/held_out.rs'
      - 'experiments/cnn_reference.rs'
      - 'experiments/depth_paired_abba.py'
      - 'tests/test_depth_paired_abba.py'
      - '.github/workflows/depth-stress-smoke.yml'

permissions:
  contents: read

jobs:
  deep-mnist-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Independent depth and numeric-oracle tests
        run: |
          cargo test --locked --all-targets
          python3 -m unittest discover -s tests -p 'test_depth_paired_abba.py' -v
      - name: Only load canonical training partition
        run: |
          python3 experiments/fetch_mnist.py --data-dir data/mnist --train-only
          test ! -e data/mnist/t10k-images-idx3-ubyte
          test ! -e data/mnist/t10k-labels-idx1-ubyte
      - name: Release compile
        run: cargo build --locked --release --example held_out
      - name: Bound all new depths at one short epoch (not convergence evidence)
        run: |
          python3 experiments/depth_paired_abba.py plan \
            --dir /tmp/mnist-depth-12-20-smoke \
            --single-pass --seeds 1337 --depths 12,16,20 \
            --epochs 1 --train-limit 64 --validation-limit 64 \
            --batch-size 16 --lr-shift 7
          python3 experiments/depth_paired_abba.py run \
            --dir /tmp/mnist-depth-12-20-smoke
          python3 experiments/depth_paired_abba.py analyze \
            --dir /tmp/mnist-depth-12-20-smoke
          test ! -e data/mnist/t10k-images-idx3-ubyte
      - name: Record construction smoke and failure diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnist-depth-12-16-20-smoke
          path: /tmp/mnist-depth-12-20-smoke/
          if-no-files-found: warn
          retention-days: 14
