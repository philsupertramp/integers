name: MNIST diagnostic 20-epoch depth recovery (x86_64)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-diagnostic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  report-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check raw numeric observability invariants and protocol
        run: |
          test "$(uname -m)" = x86_64
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          python3 -m unittest discover -s tests -p 'test_depth_paired_abba.py' -v

  recover-depth:
    name: depth-${{ matrix.depth }} / seed-4242 / 20 epochs
    needs: report-protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        depth: [16, 20]
    env:
      DEPTH: ${{ matrix.depth }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native x86_64 and MNIST development-only data
        run: |
          test "$(uname -m)" = x86_64
          python3 experiments/fetch_mnist.py --data-dir data/mnist --train-only
          test ! -e data/mnist/t10k-images-idx3-ubyte
          test ! -e data/mnist/t10k-labels-idx1-ubyte
      - name: Build identical He-v2 integer and FP32 implementations
        run: cargo build --locked --release --example held_out
      - name: Predeclared 20-epoch paired run with opt-in first-batch numeric trace
        run: |
          OUT="/tmp/mnist-diagnostic-20-d${DEPTH}-s4242"
          python3 experiments/depth_paired_abba.py plan \
            --dir "$OUT" --single-pass --trace-layers \
            --seeds 4242 --depths "$DEPTH" --epochs 20 \
            --train-limit 8192 --validation-limit 1042 \
            --batch-size 32 --lr-shift 7
          python3 experiments/depth_paired_abba.py run --dir "$OUT"
          python3 experiments/depth_paired_abba.py analyze --dir "$OUT"
          test ! -e data/mnist/t10k-images-idx3-ubyte
          test ! -e data/mnist/t10k-labels-idx1-ubyte
      - name: Publish full paired learning outcome
        if: success()
        run: cat "/tmp/mnist-diagnostic-20-d${DEPTH}-s4242/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Archive plan, raw layer traces, epoch curves and verified logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnist-diagnostic-20epoch-d${{ matrix.depth }}-s4242
          path: /tmp/mnist-diagnostic-20-d${{ matrix.depth }}-s4242/
          if-no-files-found: warn
          retention-days: 30
