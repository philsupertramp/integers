name: Research layer numeric trace smoke (paired base)

on:
  pull_request:
    branches: [research/depth-4-8-paired-abba]
    paths:
      - 'examples/held_out.rs'
      - 'src/nn/**'
      - 'experiments/cnn_reference.rs'
      - 'experiments/depth_paired_abba.py'
      - 'tests/check_depth_trace.py'
      - '.github/workflows/depth-observability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  non-invasive-observer:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Regression and format checks
        run: |
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          python3 -m unittest discover -s tests -p 'test_depth_paired_abba.py' -v
      - name: Download only pinned training MNIST, never official test
        run: |
          python3 experiments/fetch_mnist.py --data-dir data/mnist --train-only
          test ! -e data/mnist/t10k-images-idx3-ubyte
          test ! -e data/mnist/t10k-labels-idx1-ubyte
      - name: Compile integer and independent FP32 diagnostics
        run: cargo build --release --locked --example held_out
      - name: Compare trace on/off for both backends at 16 and 20 layers
        run: python3 tests/check_depth_trace.py
