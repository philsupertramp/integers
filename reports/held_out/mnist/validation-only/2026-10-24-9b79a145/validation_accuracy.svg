<title id="title">MNIST validation accuracy over ten epochs for integer and FP32</title>
<desc id="desc">On 55,000 training and 5,000 validation examples, integer rises from 87.16% to 93.53%, FP32 rises from 87.55% to 95.13%. Lines show means across three seeds, and shading shows minimum to maximum of the three seeds.</desc>
